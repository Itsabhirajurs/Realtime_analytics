<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sensor Analytics</title>
    <!-- Import Chart.js for graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; }
        .dashboard { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); width: 200px; }
        h1 { color: #333; }
        .value { font-size: 2em; font-weight: bold; color: #007bff; }
        .chart-container { width: 80%; margin: auto; background: white; padding: 20px; border-radius: 10px; margin-top: 20px;}
    </style>
</head>
<body>

    <h1>🚀 Real-Time Acceleration Dashboard</h1>
    
    <div class="dashboard">
        <div class="card">
            <h3>Total Steps</h3>
            <div class="value" id="step-count">0</div>
        </div>
        <div class="card">
            <h3>Distance (m)</h3>
            <div class="value" id="distance-count">0.0</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="accelChart"></canvas>
    </div>

    <script>
        // 1. Setup the Chart.js canvas
        const ctx = document.getElementById('accelChart').getContext('2d');
        const accelChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Time goes here
                datasets: [{
                    label: 'Acceleration Magnitude (m/s²)',
                    data: [], // Magnitude goes here
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 2,
                    tension: 0.3, // Adds a slight curve to the line
                    pointRadius: 0 // Hide individual dots for a cleaner wave
                }]
            },
            options: { animation: false, scales: { y: { suggestedMin: 0, suggestedMax: 20 } } }
        });

        // 2. Fetch data from Python every 500ms
        setInterval(async () => {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                if (data.error) {
                    console.log("Waiting for data...");
                    return;
                }

                // Update the UI text
                document.getElementById('step-count').innerText = data.steps;
                document.getElementById('distance-count').innerText = data.distance;

                // Update the Chart
                accelChart.data.labels = data.time.map(t => t.toFixed(1) + "s");
                accelChart.data.datasets[0].data = data.magnitude;
                accelChart.update();

            } catch (error) {
                console.error("Error fetching data: ", error);
            }
        }, 500); // 500 milliseconds
    </script>

</body>
</html>
